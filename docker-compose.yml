services:
  jellyfin-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-web
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 by default for setups behind Cloudflare Tunnel or a reverse proxy.
      # To expose directly on your LAN, set BIND_ADDRESS=0.0.0.0 in .env.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:80"
    environment:
      # Optional: set your Jellyfin server URL to skip the initial connection wizard.
      # If left empty, the UI displays the server setup screen in the browser.
      - JELLYFIN_SERVER_URL=${JELLYFIN_SERVER_URL:-}
      # Optional: globally customize the application title and logo URL.
      - APP_NAME=${APP_NAME:-}
      - APP_LOGO_URL=${APP_LOGO_URL:-}
    # Optional: to serve a local logo without external URLs, place your file at ./brand/logo.svg,
    # uncomment volumes below, and set APP_LOGO_URL=/brand/logo.svg in .env.
    # volumes:
    #   - ./brand:/usr/share/nginx/html/brand:ro
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
